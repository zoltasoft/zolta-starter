title: Transformez un travail dispersé en <span class="text-primary">un système clair</span>
description: Zolta Starter réunit projets, validations, automatisations et connaissances dans un espace calme où chacun sait ce qui avance et ce qui demande son attention.
seo:
  title: Zolta Starter — Le système d’exploitation des équipes concentrées
  description: Organisez les processus, automatisez le travail répétitif et comprenez la progression dans un espace flexible.
navigation: false

hero:
  links:
    - label: Commencer gratuitement
      icon: i-lucide-arrow-right
      trailing: true
      to: /saas/auth/signup
      size: xl
    - label: Voir les tarifs
      icon: i-lucide-wallet-cards
      size: xl
      color: neutral
      variant: subtle
      to: /saas/pricing

sections:
  - title: Un espace qui s’adapte à votre équipe
    description: Remplacez les réunions de statut et les feuilles éparpillées par une vue partagée des priorités, responsables, échéances et décisions.
    id: features
    orientation: horizontal
    features:
      - name: Espaces flexibles
        description: Modélisez projets, demandes, campagnes ou opérations sans imposer le même processus à chaque équipe.
        icon: i-lucide-panels-top-left
      - name: Responsabilités claires
        description: Associez chaque prochaine étape à une personne, une échéance et un statut visible.
        icon: i-lucide-user-round-check
      - name: Contexte partagé
        description: Conservez notes, fichiers, décisions et activité auprès du travail qu’ils expliquent.
        icon: i-lucide-messages-square

  - title: Automatisez la routine. Gardez le contrôle des décisions.
    description: Créez des règles lisibles qui orientent les demandes, préviennent les bonnes personnes et mettent les données à jour avec un historique complet.
    orientation: horizontal
    reverse: true
    features:
      - name: Constructeur visuel
        description: Reliez déclencheurs, conditions et actions dans un parcours compréhensible par toute l’équipe.
        icon: i-lucide-workflow
      - name: Outils connectés
        description: Intégrez les signaux de l’email, Slack, GitHub et des services déjà présents dans votre travail.
        icon: i-lucide-plug-zap
      - name: Historique inspectable
        description: Comprenez ce qui a été exécuté, pourquoi une décision a été prise et où intervenir.
        icon: i-lucide-history

features:
  title: L’essentiel d’un produit SaaS moderne
  description: Des capacités ciblées pour collaborer, automatiser, comprendre l’activité et gérer les comptes de façon responsable.
  items:
    - title: Collaboration en temps réel
      description: Mises à jour, commentaires et mentions alignent l’équipe sans doublons ni actualisations constantes.
      icon: i-lucide-users-round
    - title: Intégrations utiles
      description: Connectez les outils existants et synchronisez la source de vérité de votre équipe.
      icon: i-lucide-blocks
    - title: Analyses exploitables
      description: Comprenez la charge, les cycles et les résultats grâce à des rapports orientés décision.
      icon: i-lucide-chart-no-axes-combined
    - title: Rôles et permissions
      description: Définissez qui peut consulter, modifier, valider ou administrer chaque espace et processus.
      icon: i-lucide-key-round
    - title: Notifications ciblées
      description: Transmettez les événements importants par email ou dans l’application sans créer de bruit.
      icon: i-lucide-bell-ring
    - title: Historique complet
      description: Conservez une chronologie lisible des changements, commentaires, automatisations et actions sensibles.
      icon: i-lucide-scroll-text

trust:
  headline: Le contrôle dès la conception
  title: Pour les équipes qui prennent leurs données au sérieux
  description: La sécurité et la gestion du compte appartiennent aux fondations du produit, pas à une option réservée aux grandes entreprises.
  items:
    - title: Accès au moindre privilège
      description: Les rôles et permissions explicites réservent les opérations sensibles aux bonnes personnes.
      icon: i-lucide-shield-check
    - title: Changements traçables
      description: Un historique conserve les événements importants du produit et du compte pour faciliter le contrôle.
      icon: i-lucide-file-clock
    - title: Données portables
      description: Exportez les données de l’espace ou supprimez définitivement un compte grâce à des contrôles explicites.
      icon: i-lucide-database-backup

faq:
  headline: Questions fréquentes
  title: Tout ce qu’il faut pour évaluer Zolta Starter
  description: Des réponses claires sur le produit fictif et sur le modèle réutilisable présenté ici.
  items:
    - title: Zolta Starter est-il un vrai produit commercial ?
      description: Zolta Starter est un produit fictif créé pour démontrer une expérience SaaS pensée pour la production. Le marketing, l’authentification, la traduction, le tableau de bord et les parcours de compte forment une base fonctionnelle.
    - title: Puis-je explorer l’espace authentifié ?
      description: Oui. Générez un compte temporaire depuis la connexion. Ses données privées sont automatiquement programmées pour suppression lorsque la session de démonstration expire.
    - title: Le modèle prend-il en charge les thèmes clair et sombre ?
      description: Oui. Tous les écrans publics et authentifiés partagent les mêmes jetons de design et respectent la préférence d’apparence.
    - title: L’expérience est-elle disponible en anglais ?
      description: Oui. La navigation, le contenu marketing, l’authentification, le tableau de bord et les paramètres sont disponibles en français et en anglais.
    - title: Cette base peut-elle devenir un produit autonome ?
      description: Oui. Les routes, composants, contenus et éléments de présentation propres au SaaS vivent dans une couche Nuxt indépendante, conçue pour être extraite et adaptée.

testimonials:
  headline: Intention du modèle
  title: Une histoire produit crédible, sans faux témoignages
  description: Zolta Starter démontre les sections et parcours d’un SaaS complet tout en indiquant clairement que le produit est fictif.
  items: []

cta:
  title: Explorez tout le parcours produit
  description: Découvrez le produit public, créez un compte temporaire et poursuivez dans la zone authentifiée réutilisable.
  links:
    - label: Ouvrir l’espace de démonstration
      to: /saas/auth/login
      trailingIcon: i-lucide-arrow-right
    - label: Comparer les offres
      to: /saas/pricing
      variant: subtle
      icon: i-lucide-wallet-cards
    - label: Lire les nouveautés
      to: /saas/changelog
      variant: ghost
      icon: i-lucide-history
