title: Turn scattered work into <span class="text-primary">one clear system</span>
description: Zolta Starter brings projects, approvals, automations, and team knowledge into one calm workspace—so everyone knows what is moving and what needs attention.
seo:
  title: Zolta Starter — The operating system for focused teams
  description: Organize team workflows, automate routine work, and understand progress in one flexible workspace.
navigation: false

hero:
  links:
    - label: Start free
      icon: i-lucide-arrow-right
      trailing: true
      to: /saas/auth/signup
      size: xl
    - label: See pricing
      icon: i-lucide-wallet-cards
      size: xl
      color: neutral
      variant: subtle
      to: /saas/pricing

sections:
  - title: One workspace, shaped around your team
    description: Replace status meetings and scattered spreadsheets with a shared view of priorities, owners, due dates, and the conversations behind every decision.
    id: features
    orientation: horizontal
    features:
      - name: Flexible workspaces
        description: Model projects, requests, campaigns, or operations without forcing every team into the same process.
        icon: i-lucide-panels-top-left
      - name: Clear ownership
        description: Give every next step an owner, deadline, and visible status so work never disappears between tools.
        icon: i-lucide-user-round-check
      - name: Shared context
        description: Keep notes, files, decisions, and activity beside the work they explain.
        icon: i-lucide-messages-square

  - title: Automate the routine. Keep control of the decisions.
    description: Build readable rules that route requests, notify the right people, and update records while preserving a complete history of every run.
    orientation: horizontal
    reverse: true
    features:
      - name: Visual automation builder
        description: Connect triggers, conditions, and actions in a flow your whole team can understand.
        icon: i-lucide-workflow
      - name: Connected tools
        description: Bring signals from email, Slack, GitHub, and the services already in your workflow.
        icon: i-lucide-plug-zap
      - name: Inspectable history
        description: See what ran, why a decision was made, and where a process needs attention.
        icon: i-lucide-history

features:
  title: The essentials of a modern SaaS product
  description: A focused set of capabilities for collaboration, automation, visibility, and responsible account management.
  items:
    - title: Real-time collaboration
      description: Updates, comments, and mentions keep teams aligned without constant refreshes or duplicate work.
      icon: i-lucide-users-round
    - title: Useful integrations
      description: Connect the tools your team already uses and keep the source of truth synchronized.
      icon: i-lucide-blocks
    - title: Actionable insights
      description: Understand workload, cycle time, and completion trends with reports designed for decisions.
      icon: i-lucide-chart-no-axes-combined
    - title: Roles and permissions
      description: Decide who can view, change, approve, or administer each workspace and workflow.
      icon: i-lucide-key-round
    - title: Focused notifications
      description: Route important updates by email or in-app without turning every event into an interruption.
      icon: i-lucide-bell-ring
    - title: Complete activity history
      description: Preserve a readable timeline of changes, comments, automations, and access-sensitive actions.
      icon: i-lucide-scroll-text

trust:
  headline: Control by design
  title: Built for teams that take their data seriously
  description: Security and account controls belong in the product foundation, not in an enterprise-only afterthought.
  items:
    - title: Least-privilege access
      description: Workspace roles and explicit permissions keep sensitive operations available only to the right people.
      icon: i-lucide-shield-check
    - title: Traceable changes
      description: An activity history records meaningful product and account events for review and accountability.
      icon: i-lucide-file-clock
    - title: Portable account data
      description: Export workspace data or permanently delete an account through clear self-service controls.
      icon: i-lucide-database-backup

faq:
  headline: Frequently asked questions
  title: Everything you need to evaluate Zolta Starter
  description: Clear answers about the fictional product and the reusable template demonstrated here.
  items:
    - title: Is Zolta Starter a real commercial product?
      description: Zolta Starter is a fictional product created to demonstrate a production-minded SaaS experience. The marketing, authentication, localization, dashboard shell, and account flows are functional template foundations.
    - title: Can I explore the authenticated experience?
      description: Yes. Generate a temporary demo account on the login page. Its private data is automatically scheduled for deletion when the demo session expires.
    - title: Does the template support light and dark themes?
      description: Yes. Every public and authenticated screen uses the same design tokens and supports light and dark appearance preferences.
    - title: Is the experience available in French?
      description: Yes. Navigation, marketing content, authentication, dashboard, and settings are available in English and French.
    - title: Can this become a standalone product?
      description: Yes. The SaaS-specific routes, components, content, and presentation logic live in an independent Nuxt layer designed to be extracted and adapted.

testimonials:
  headline: Template intent
  title: A credible product story without invented social proof
  description: Zolta Starter demonstrates the sections and flows a complete SaaS needs while remaining transparent that the product is fictional.
  items: []

cta:
  title: Explore the complete product journey
  description: Start with the public product story, create a temporary account, and continue into the reusable authenticated shell.
  links:
    - label: Open the demo workspace
      to: /saas/auth/login
      trailingIcon: i-lucide-arrow-right
    - label: Compare plans
      to: /saas/pricing
      variant: subtle
      icon: i-lucide-wallet-cards
    - label: Read the changelog
      to: /saas/changelog
      variant: ghost
      icon: i-lucide-history
